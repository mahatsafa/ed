<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mock situs asli (latihan)</title>
<style>
  .hidden { display: none; }
  .disable { opacity: .4; }
  .learning__tasksNav_task { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; margin: 2px; }
  .learning__tasksNav_task--done { background: #2a6; }
  li { cursor: pointer; }
</style>
</head>
<body>
<!-- Meniru selector situs asli. Hanya untuk uji otomatis, bukan situs sebenarnya. -->
<header>
  <ul>
    <li id="settingsMenu__personal" class="settingsMenu__listCat settingsMenu__listCat--closed">My Info</li>
    <li id="settingsMenu__help" class="settingsMenu__listCat settingsMenu__listCat--closed">Help</li>
    <li id="settingsMenu__dictionary" class="settingsMenu__listCat settingsMenu__listCat--closed">Dictionary</li>
  </ul>
</header>
<h2 id="petunjuk"></h2>
<main id="area"></main>
<p id="reminder" class="hidden">Reminder: jawab dulu.</p>
<ul>
  <li id="SeeAnswer">See Answer</li>
  <li id="CheckAnswer">Check Answer</li>
</ul>
<a class="tasksBtnext" href="javascript:void(0)">Next</a>
<div id="nav"></div>

<script>
const params = new URLSearchParams(location.search);
const tugas = ["video", "pilihan", "dropdown", "bicara"];
if (params.get("skenario") === "tidakdikenal") tugas.push("teks");  // jenis soal yang tidak dikenal bot
let i = 0;
const selesai = new Set();
window.seeAnswerKlik = 0;
const $ = (s) => document.querySelector(s);

// Pemutar: video dari canvas; klik pada video memutar (seperti pemutar situs asli).
const kanvas = document.createElement("canvas");
kanvas.width = 160; kanvas.height = 90;
const ctx = kanvas.getContext("2d");
let t = 0;
setInterval(() => { ctx.fillStyle = `hsl(${t % 360},60%,50%)`; ctx.fillRect(0, 0, 160, 90); t += 5; }, 100);

function tandaiSelesai() { selesai.add(i); gambarNav(); }
function gambarNav() {
  $("#nav").innerHTML = tugas.map((_, n) =>
    `<span class="learning__tasksNav_task${selesai.has(n) ? " learning__tasksNav_task--done" : ""}"></span>`).join("");
}

function gambar() {
  $("#reminder").classList.add("hidden");
  const jenis = tugas[i];
  const area = $("#area");
  if (jenis === "video") {
    $("#petunjuk").textContent = "Watch the video.";
    area.innerHTML = '<video id="v" muted width="160" height="90"></video>';
    const v = $("#v");
    v.srcObject = kanvas.captureStream(10);
    v.addEventListener("click", () => v.play());
    v.addEventListener("playing", tandaiSelesai);
  } else if (jenis === "pilihan") {
    $("#petunjuk").textContent = "Choose the best answer.";
    area.innerHTML = [1, 2, 3, 4].map((n) =>
      `<div class="prMCQ__answers"><input type="radio" class="layout__radio" id="question-1_answer-${n}" name="q1"> Opsi ${n}</div>`).join("");
  } else if (jenis === "dropdown") {
    $("#petunjuk").textContent = "Select the correct answer from the drop-down list.";
    area.innerHTML = '<p>It <select id="dd"><option value=""></option><option>comes</option><option>come</option></select> at 10 A.M.</p>';
  } else if (jenis === "bicara") {
    $("#petunjuk").textContent = "Speaking practice.";
    area.innerHTML = '<div class="speakingInteractButtonWrapper"><div class="buttonWrapper continueWrapper disable"><a class="button continue">Start</a></div></div><p id="status-start"></p>';
    setTimeout(() => { const w = $(".continueWrapper"); if (w) w.classList.remove("disable"); }, 800);
    $(".continue").addEventListener("click", () => {
      if ($(".continueWrapper").classList.contains("disable")) return;
      $("#status-start").textContent = "sudah dimulai";
      tandaiSelesai();
    });
  } else {
    $("#petunjuk").textContent = "Type your answer in the box.";  // tidak dikenal
    area.innerHTML = '<textarea id="ta" rows="2" cols="30"></textarea>';
  }
  gambarNav();
}

document.querySelectorAll("header li").forEach((li) => li.addEventListener("click", () => {
  document.querySelectorAll("header li").forEach((x) => {
    x.classList.remove("settingsMenu__listCat--open");
    x.classList.add("settingsMenu__listCat--closed");
  });
  li.classList.add("settingsMenu__listCat--open");
  li.classList.remove("settingsMenu__listCat--closed");
}));
$("#SeeAnswer").addEventListener("click", () => { window.seeAnswerKlik += 1; });
$("#CheckAnswer").addEventListener("click", () => {
  const jenis = tugas[i];
  const benar = (jenis === "pilihan" && document.querySelector("input.layout__radio:checked")) ||
                (jenis === "dropdown" && $("#dd").value !== "");
  $("#reminder").classList.toggle("hidden", !!benar);
  if (benar) tandaiSelesai();
});
$(".tasksBtnext").addEventListener("click", () => { if (i < tugas.length - 1) { i += 1; gambar(); } });
gambar();
</script>
</body>
</html>
