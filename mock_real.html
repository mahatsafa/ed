<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mock situs asli (latihan)</title>
<style>
  .hidden { display: none; }
  .disable { opacity: .4; }
  .learning__tasksNav_task { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; margin: 2px; }
  .learning__tasksNav_task--done { background: #2a6; }
  li { cursor: pointer; }
  .kotak-video { position: relative; display: inline-block; }
  .learning__RAMROverlayW { position: absolute; inset: 0; }
  .learning__RAMRButton { width: 100%; height: 100%; }
  .prFITB__DDLOptionsW { display: inline-block; vertical-align: middle; }
  .DDLOptions__selected { min-width: 129px; min-height: 24px; border: 1px solid #888; }
</style>
</head>
<body>
<!-- Meniru selector dan perilaku situs asli. Hanya untuk uji otomatis, bukan situs sebenarnya. -->
<header>
  <ul>
    <li id="settingsMenu__personal" class="settingsMenu__listCat settingsMenu__listCat--closed">My Info</li>
    <li id="settingsMenu__help" class="settingsMenu__listCat settingsMenu__listCat--closed">Help</li>
    <li id="settingsMenu__dictionary" class="settingsMenu__listCat settingsMenu__listCat--closed">Dictionary</li>
  </ul>
</header>
<h2 id="petunjuk" class="learning__headerIW"></h2>
<!-- tooltip tersembunyi di situs asli; kata "Record" di sini tidak boleh dianggap instruksi soal -->
<ul><li id="SRIcon" style="display:none"><span>Record Yourself</span></li></ul>
<main id="area"></main>
<p id="reminder" class="hidden">Reminder: jawab dulu.</p>
<ul>
  <li id="SeeAnswer">See Answer</li>
  <li id="CheckAnswer">Check Answer</li>
</ul>
<a class="tasksBtnext" href="javascript:void(0)">Next</a>
<div id="nav"></div>
<!-- Panel Dictionary: select ini terlihat di situs asli setelah menu Dictionary dibuka; bukan bagian soal. -->
<div id="DictionaryPanelContainer"><select id="selectLanguage"><option value="">--</option><option value="id">Indonesia</option></select></div>

<script>
const params = new URLSearchParams(location.search);
const skenario = params.get("skenario");
let tugas = ["video", "pilihan", "dropdown", "cloze", "bicara"];
if (skenario === "tidakdikenal") tugas.push("teks");  // jenis soal yang tidak dikenal bot
if (skenario === "drag") tugas = ["drag", "pilihan"];  // video + soal seret (tidak didukung)
if (skenario === "kosong") tugas = ["kosong"];  // tidak ada kontrol soal yang dikenal
if (skenario === "dropdown") tugas = ["dropdown"];  // hanya soal dropdown kustom
if (skenario === "pilihan") tugas = ["pilihan"];  // hanya soal pilihan ganda (2 pertanyaan)
if (skenario === "radioluar") tugas = ["radioluar"];  // radio di luar .prMCQ__qaSet (tak bisa dikelompokkan)
let i = 0;
const selesai = new Set();
window.seeAnswerKlik = 0;
const $ = (s) => document.querySelector(s);

// Video dari canvas.
const kanvas = document.createElement("canvas");
kanvas.width = 160; kanvas.height = 90;
const ctx = kanvas.getContext("2d");
let t = 0;
setInterval(() => { ctx.fillStyle = `hsl(${t % 360},60%,50%)`; ctx.fillRect(0, 0, 160, 90); t += 5; }, 100);

function tandaiSelesai() { selesai.add(i); gambarNav(); }
function gambarNav() {
  $("#nav").innerHTML = tugas.map((_, n) =>
    `<span class="learning__tasksNav_task${selesai.has(n) ? " learning__tasksNav_task--done" : ""}"></span>`).join("");
}

// Pemutar seperti situs asli: tombol putar menutupi <video>, klik langsung ke video tertahan.
function pasangVideo(area) {
  area.insertAdjacentHTML("afterbegin",
    '<div class="kotak-video"><video id="MP" muted width="160" height="90"></video>' +
    '<div class="learning__RAMROverlayW"><div class="learning__RAMRButton learning__RAMRButton--play"></div></div></div>');
  const v = $("#MP");
  v.srcObject = kanvas.captureStream(10);
  v.addEventListener("playing", () => { if (tugas[i] === "video") tandaiSelesai(); });
  $(".learning__RAMRButton--play").addEventListener("click", () => {
    v.play();
    $(".learning__RAMROverlayW").remove();
  });
}

function gambar() {
  $("#reminder").classList.add("hidden");
  const jenis = tugas[i];
  const area = $("#area");
  area.innerHTML = "";
  if (jenis === "video") {
    $("#petunjuk").textContent = "Watch the video.";
    pasangVideo(area);
  } else if (jenis === "drag") {
    $("#petunjuk").textContent = "Drag the correct answer.";
    pasangVideo(area);
    area.insertAdjacentHTML("beforeend", '<p>It ___ at 10 A.M. <span class="seret">comes</span></p>');
  } else if (jenis === "pilihan") {
    $("#petunjuk").textContent = "Choose the best answer.";
    area.innerHTML = [[1, 2, 3], [4, 5, 6]].map((ids, q) =>
      `<div class="prMCQ__qaSet"><div class="prMCQ__questionText">Pertanyaan ${q + 1}?</div>` + ids.map((n) =>
        `<div class="prMCQ__answers"><input type="radio" class="layout__radio" id="question-${q + 1}_answer-${n}" name="question-${q + 1}_answer-${n}">` +
        `<label class="prMCQ__answerLabel" for="question-${q + 1}_answer-${n}">Opsi ${n}</label></div>`).join("") + "</div>").join("");
  } else if (jenis === "radioluar") {
    $("#petunjuk").textContent = "Choose the best answer.";
    area.innerHTML = '<input type="radio" class="layout__radio" id="r1" name="r1"><label for="r1">Opsi</label>';
  } else if (jenis === "dropdown") {
    $("#petunjuk").textContent = "Select the correct answer from the drop-down list.";
    // Dropdown kustom seperti situs asli: daftar muncul di dalam wrapper saat diklik, hilang setelah memilih.
    const dd = (opsi) => `<div class="prFITB__DDLOptionsW"><div class="DDLOptions__selected"></div></div>`;
    area.innerHTML = `<p>It ${dd()} at 10 A.M. and they ${dd()} home.</p>`;
    area.querySelectorAll(".prFITB__DDLOptionsW").forEach((w) => {
      const sel = w.querySelector(".DDLOptions__selected");
      sel.addEventListener("click", () => {
        if (w.querySelector(".DDLOptions__list")) return;
        w.insertAdjacentHTML("beforeend", '<div class="DDLOptions__list">' +
          ["comes", "come", "coming"].map((o) => `<div class="DDLOptions__listItem">${o}</div>`).join("") + "</div>");
        w.querySelectorAll(".DDLOptions__listItem").forEach((it) => it.addEventListener("click", (e) => {
          e.stopPropagation();
          sel.textContent = it.textContent;
          w.querySelector(".DDLOptions__list").remove();
        }));
      });
    });
  } else if (jenis === "cloze") {
    $("#petunjuk").textContent = "Read the interview, and fill in the missing words.";
    const kotak = [0, 1, 2].map((n) =>
      `<div class="prCLZ__regContainer" style="display:inline-block;margin:4px"><div class="dndZone" id="0_${n}" style="min-width:90px;min-height:28px;border-bottom:2px solid #000"></div></div>`).join(" . ");
    const kata = ["teach", "agency", "need", "working"].map((w) =>
      `<div class="dnditem draggable" style="display:inline-block;margin:4px;padding:4px;border:1px solid #888;user-select:none">${w}</div>`).join("");
    area.innerHTML = `<div class="prCLZ__answersWrapper"><p>Hi ${kotak}</p></div>` +
      `<div class="prCLZ__wordsBankWrapper" id="bankContainer"><div class="dndZone" id="bank_9">${kata}</div></div>`;
    pasangSeret();
  } else if (jenis === "bicara") {
    $("#petunjuk").textContent = "Speaking practice.";
    area.innerHTML = '<div class="speakingInteractButtonWrapper"><div class="buttonWrapper continueWrapper disable"><a class="button continue">Start</a></div></div><p id="status-start"></p>';
    setTimeout(() => { const w = $(".continueWrapper"); if (w) w.classList.remove("disable"); }, 800);
    $(".continue").addEventListener("click", () => {
      if ($(".continueWrapper").classList.contains("disable")) return;
      $("#status-start").textContent = "sudah dimulai";
      tandaiSelesai();
    });
  } else if (jenis === "kosong") {
    $("#petunjuk").textContent = "Read the ad.";  // tidak ada kontrol yang dikenal bot
    area.innerHTML = "<p>Hanya teks.</p>";
  } else {
    $("#petunjuk").textContent = "Type your answer in the box.";  // tidak dikenal
    area.innerHTML = '<textarea id="ta" rows="2" cols="30"></textarea>';
  }
  gambarNav();
}

// Seret-lepas mirip Dragula: perlu mousedown, beberapa mousemove, lalu mouseup di atas kotak kosong.
let pegang = null, bergerak = 0;
function pasangSeret() {
  document.querySelectorAll(".dnditem").forEach((el) => el.addEventListener("mousedown", (e) => {
    pegang = el; bergerak = 0; e.preventDefault();
  }));
}
document.addEventListener("mousemove", () => { if (pegang) bergerak += 1; });
document.addEventListener("mouseup", (e) => {
  if (!pegang) return;
  const zona = document.elementFromPoint(e.clientX, e.clientY)?.closest(".dndZone");
  if (bergerak >= 2 && zona && zona.id !== "bank_9" && !zona.querySelector(".dnditem")) {
    zona.appendChild(pegang);
    pegang.style.margin = "0";
  }
  pegang = null;
});

// Modal "Video Tutorials" seperti situs asli: menutupi halaman, hilang (dihapus dari DOM) saat ditutup.
function tutupModal() { const m = $("ngb-modal-window"); if (m) m.remove(); }
function bukaModal() {
  if ($("ngb-modal-window")) return;
  document.body.insertAdjacentHTML("beforeend",
    '<ngb-modal-window role="dialog" class="modal fade show d-block videoTutorialsModal" ' +
    'style="position:fixed;inset:0;background:#fffe;z-index:99"><div class="modal-content">Video Tutorials ' +
    '<button class="close" aria-label="Close">x</button></div></ngb-modal-window>');
  $("ngb-modal-window .close").addEventListener("click", tutupModal);
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") tutupModal(); });

document.querySelectorAll("header li").forEach((li) => li.addEventListener("click", () => {
  document.querySelectorAll("header li").forEach((x) => {
    x.classList.remove("settingsMenu__listCat--open");
    x.classList.add("settingsMenu__listCat--closed");
  });
  li.classList.add("settingsMenu__listCat--open");
  li.classList.remove("settingsMenu__listCat--closed");
  if (li.id === "settingsMenu__help") bukaModal();
}));
$("#SeeAnswer").addEventListener("click", () => { window.seeAnswerKlik += 1; });
$("#CheckAnswer").addEventListener("click", () => {
  const jenis = tugas[i];
  const benar = (jenis === "pilihan" && [...document.querySelectorAll(".prMCQ__qaSet")]
                    .every((s) => s.querySelector("input.layout__radio:checked"))) ||
                (jenis === "dropdown" && [...document.querySelectorAll(".DDLOptions__selected")]
                    .every((e) => e.textContent.trim() !== "")) ||
                (jenis === "cloze" && document.querySelectorAll(".prCLZ__regContainer .dnditem").length === 3);
  $("#reminder").classList.toggle("hidden", !!benar);
  if (benar) tandaiSelesai();
});
// Setelah Next, halaman dikosongkan dulu lalu dirender 500 ms kemudian (seperti Angular di situs asli).
$(".tasksBtnext").addEventListener("click", () => {
  if (i < tugas.length - 1) { i += 1; $("#area").innerHTML = ""; setTimeout(gambar, 500); }
});
gambar();
</script>
</body>
</html>
